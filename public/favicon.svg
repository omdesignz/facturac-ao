<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">facturac.ao</title>
  <rect width="512" height="512" rx="112" fill="#171716"/>
  <!--
    Carimbo, simplified for favicon sizes. Browsers render this at 16-32px,
    where the perforated edge fills in and the inner ring collapses into the
    outer one — so this cut drops to a single heavier ring. The full seal
    lives in the 180px+ raster icons.
  -->
  <g transform="rotate(-8 256 256)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="168" stroke="#f9b233" stroke-width="34"/>
    <path d="M183 262L238 317L340 190" stroke="#f7f4ed" stroke-width="46"/>
  </g>
</svg>
