<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      
    @font-face { font-family: "Inter"; font-weight: 500; font-style: normal; font-display: block;
      src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: block;
      src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); }
    @font-face { font-family: "Inter Display"; font-weight: 600; font-style: normal; font-display: block;
      src: url("assets/fonts/InterDisplay-SemiBold.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      #phone { position: absolute; left: 0; top: 0; width: 1350px; height: 2760px;
        filter: drop-shadow(0 34px 60px rgba(0,0,0,0.14)) drop-shadow(0 6px 14px rgba(0,0,0,0.08)); }
      #screen { position: absolute; left: 72px; top: 69px; width: 1206px; height: 2622px;
        overflow: hidden; border-radius: 150px; background: #fff; }
      #screen > img, #screen > video { position: absolute; left: 0; top: 0; width: 1206px; height: 2622px; display: block; }
      .spot { position: absolute; border-radius: 34px; box-shadow: 0 0 0 4000px rgba(255,255,255,0.74); opacity: 0; }
      #spot-0 { left: 112px; top: 716px; width: 450px; height: 96px; }
      #bezel { position: absolute; inset: 0; width: 1350px; height: 2760px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.97" data-width="1080" data-height="1920">
      <div id="phone" data-layout-allow-overflow>
        <div id="screen">
          <video id="shot-notice" class="clip" src="assets/capture/notify-60.mp4" data-start="0" data-duration="1.86" data-track-index="0" muted playsinline data-media-start="2.19"></video>
          <img id="shot-banner" class="clip" src="assets/capture/banner.png" data-start="1.81" data-duration="1.49" data-track-index="1" alt="">
          <video id="shot-open" class="clip" src="assets/capture/notify-60.mp4" data-start="3.25" data-duration="1.25" data-track-index="0" muted playsinline data-media-start="4.9"></video>
          <img id="shot-clientes" class="clip" src="assets/capture/clientes.png" data-start="4.3" data-duration="2.21" data-track-index="1" alt="">
          <img id="shot-artigos" class="clip" src="assets/capture/artigos.png" data-start="6.31" data-duration="2.02" data-track-index="0" alt="">
          <video id="shot-emit" class="clip" src="assets/capture/emit-60.mp4" data-start="8.13" data-duration="3.04" data-track-index="1" muted playsinline data-media-start="5.32"></video>
          <img id="shot-validada" class="clip" src="assets/capture/validada.png" data-start="10.97" data-duration="10.0" data-track-index="0" alt="">
          <div id="spot-0" class="spot"></div>
        </div>
        <img id="bezel" src="assets/apple/iphone-17-black.png" alt="">
      </div>
      <div id="el-tudo-1-atencao" class="scene" data-composition-id="tudo-1-atencao" data-composition-src="compositions/tudo-1-atencao.html" data-start="0" data-duration="4.25" data-track-index="2" data-track-kind="graphics"></div>
      <div id="el-tudo-2-migracao" class="scene" data-composition-id="tudo-2-migracao" data-composition-src="compositions/tudo-2-migracao.html" data-start="4.25" data-duration="3.82" data-track-index="3" data-track-kind="graphics"></div>
      <div id="el-tudo-3-comunicacao" class="scene" data-composition-id="tudo-3-comunicacao" data-composition-src="compositions/tudo-3-comunicacao.html" data-start="8.07" data-duration="5.44" data-track-index="4" data-track-kind="graphics"></div>
      <div id="el-tudo-4-fim" class="scene" data-composition-id="tudo-4-fim" data-composition-src="compositions/tudo-4-fim.html" data-start="13.55" data-duration="2.75" data-track-index="5" data-track-kind="graphics"></div>

      <audio id="sfx-0" src="assets/sfx/pop-soft.mp3" data-start="1.41" data-duration="0.575" data-volume="0.14" data-track-index="10"></audio>
      <audio id="sfx-1" src="assets/sfx/pop-soft.mp3" data-start="3.25" data-duration="0.575" data-volume="0.16" data-track-index="11"></audio>

      <audio id="sfx-4" src="assets/sfx/pop-confirm.mp3" data-start="9.95" data-duration="0.575" data-volume="0.12" data-track-index="14"></audio>
      <audio id="sfx-5" src="assets/sfx/chime-resolve.mp3" data-start="11.77" data-duration="1.441" data-volume="0.1" data-track-index="15"></audio>
      <audio id="sfx-6" src="assets/sfx/impact-soft.mp3" data-start="16.85" data-duration="2.0" data-volume="0.16" data-track-index="10"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 20.97);
      tl.set("#phone", { x: 162.0, y: 560, scale: 0.56, transformOrigin: "0 0" }, 0);
      tl.fromTo("#shot-clientes", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 4.3);
      tl.fromTo("#shot-artigos", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 6.31);
      tl.fromTo("#shot-emit", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 8.13);
      tl.fromTo("#shot-validada", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 10.97);
      tl.fromTo("#spot-0", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 11.77);
      tl.to("#spot-0", { opacity: 0, duration: 0.2, ease: "power2.in" }, 13.25);
      tl.to("#phone", { x: 162.0, y: 2080, scale: 0.56, duration: 0.42, ease: "power2.in" }, 13.31);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
