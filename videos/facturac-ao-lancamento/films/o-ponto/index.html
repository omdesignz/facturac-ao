<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      
    @font-face { font-family: "Inter"; font-weight: 500; font-style: normal; font-display: block;
      src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: block;
      src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); }
    @font-face { font-family: "Inter Display"; font-weight: 600; font-style: normal; font-display: block;
      src: url("assets/fonts/InterDisplay-SemiBold.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      #phone { position: absolute; left: 0; top: 0; width: 1350px; height: 2760px;
        filter: drop-shadow(0 34px 60px rgba(0,0,0,0.14)) drop-shadow(0 6px 14px rgba(0,0,0,0.08)); }
      #screen { position: absolute; left: 72px; top: 69px; width: 1206px; height: 2622px;
        overflow: hidden; border-radius: 150px; background: #fff; }
      #screen > img, #screen > video { position: absolute; left: 0; top: 0; width: 1206px; height: 2622px; display: block; }
      .spot { position: absolute; border-radius: 34px; box-shadow: 0 0 0 4000px rgba(255,255,255,0.74); opacity: 0; }
      #spot-0 { left: 61px; top: 495px; width: 1084px; height: 240px; } #spot-1 { left: 61px; top: 752px; width: 1084px; height: 118px; } #spot-2 { left: 61px; top: 1407px; width: 1084px; height: 504px; }
      #bezel { position: absolute; inset: 0; width: 1350px; height: 2760px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.99" data-width="1080" data-height="1920">
      <div id="phone" data-layout-allow-overflow>
        <div id="screen">
          <img id="shot-home" class="clip" src="assets/capture/home.png" data-start="0" data-duration="7.23" data-track-index="0" alt="">
          <video id="shot-launch" class="clip" src="assets/capture/launch-60.mp4" data-start="7.13" data-duration="2.45" data-track-index="1" muted playsinline data-media-start="2.5"></video>
          <img id="shot-hoje" class="clip" src="assets/capture/hoje.png" data-start="9.38" data-duration="8.61" data-track-index="0" alt="">
          <div id="spot-0" class="spot"></div><div id="spot-1" class="spot"></div><div id="spot-2" class="spot"></div>
        </div>
        <img id="bezel" src="assets/apple/iphone-17-black.png" alt="">
      </div>
      <div id="el-ponto-1-nome" class="scene" data-composition-id="ponto-1-nome" data-composition-src="compositions/ponto-1-nome.html" data-start="0" data-duration="7.73" data-track-index="2" data-track-kind="graphics"></div>
      <div id="el-ponto-2-hoje" class="scene" data-composition-id="ponto-2-hoje" data-composition-src="compositions/ponto-2-hoje.html" data-start="9.45" data-duration="4.0" data-track-index="3" data-track-kind="graphics"></div>
      <div id="el-ponto-3-disponivel" class="scene" data-composition-id="ponto-3-disponivel" data-composition-src="compositions/ponto-3-disponivel.html" data-start="13.45" data-duration="4.54" data-track-index="4" data-track-kind="graphics"></div>
      <audio id="music" src="assets/bgm/track.mp3" data-start="0" data-duration="17.99" data-volume="0.9" data-fade-out="1.2" data-track-index="9"></audio>
      <audio id="sfx-0" src="assets/sfx/pop-confirm.mp3" data-start="3.09" data-duration="0.575" data-volume="0.14" data-track-index="10"></audio>
      <audio id="sfx-1" src="assets/sfx/pop-soft.mp3" data-start="7.33" data-duration="0.575" data-volume="0.2" data-track-index="11"></audio>
      <audio id="sfx-2" src="assets/sfx/whoosh-soft.mp3" data-start="7.43" data-duration="1.579" data-volume="0.1" data-track-index="12"></audio>
      <audio id="sfx-3" src="assets/sfx/impact-soft.mp3" data-start="14.33" data-duration="2.0" data-volume="0.16" data-track-index="13"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 17.99);
      tl.set("#phone", { x: 202.5, y: 600, scale: 0.5, transformOrigin: "0 0" }, 0);
      tl.fromTo("#spot-0", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 9.53);
      tl.to("#spot-0", { opacity: 0, duration: 0.2, ease: "power2.in" }, 10.55);
      tl.fromTo("#spot-1", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 10.65);
      tl.to("#spot-1", { opacity: 0, duration: 0.2, ease: "power2.in" }, 11.75);
      tl.fromTo("#spot-2", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 11.85);
      tl.to("#spot-2", { opacity: 0, duration: 0.2, ease: "power2.in" }, 13.21);
      tl.to("#phone", { x: 121.5, y: 104.4, scale: 0.62, duration: 0.6, ease: "power3.inOut" }, 7.39);
      tl.to("#phone", { x: 40.5, y: 280, scale: 0.74, duration: 0.55, ease: "power3.inOut" }, 9.11);
      tl.to("#phone", { x: 162.0, y: 2080, scale: 0.56, duration: 0.42, ease: "power2.in" }, 13.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
