<!doctype html>
<html lang="pt">
  <head>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      #phone { position: absolute; left: 0; top: 0; width: 1350px; height: 2760px;
        filter: drop-shadow(0 46px 70px rgba(0,0,0,0.20)) drop-shadow(0 10px 18px rgba(0,0,0,0.14)); }
      #screen { position: absolute; left: 72px; top: 69px; width: 1206px; height: 2622px;
        overflow: hidden; border-radius: 150px; background: #fff; }
      #screen img, #screen video { position: absolute; inset: 0; width: 1206px; height: 2622px; display: block; }
      #bezel { position: absolute; inset: 0; width: 1350px; height: 2760px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.0" data-width="1080" data-height="1920">
